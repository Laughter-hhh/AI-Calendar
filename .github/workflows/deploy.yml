name: Build & Deploy

# 推送 main 分支时自动构建并部署；也可以在 Actions 页面手动触发
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.16.0

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Lint
        working-directory: frontend
        run: pnpm lint

      - name: Build
        working-directory: frontend
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: pnpm build

      - name: Release regression tests
        env:
          BASE_URL: http://127.0.0.1:3100
          DATABASE_PATH: ${{ runner.temp }}/ai-calendar-release.db
        run: |
          set -e
          cd frontend
          PORT=3100 pnpm start > "$RUNNER_TEMP/ai-calendar-test.log" 2>&1 &
          SERVER_PID=$!
          cleanup() { kill "$SERVER_PID" 2>/dev/null || true; }
          trap cleanup EXIT
          for attempt in {1..30}; do
            if curl -fsS "$BASE_URL/api/health" >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              cat "$RUNNER_TEMP/ai-calendar-test.log"
              exit 1
            fi
            sleep 1
          done
          cd ..
          node scripts/generate-test-data.mjs
          node scripts/parser-cases.mjs
          node scripts/timeline-layout-test.mjs
          node scripts/offline-test.mjs
          node scripts/smoke-test.mjs
          node scripts/ui-render-check.mjs
          node scripts/calendar-feature-test.mjs

      - name: Prepare deploy bundle
        run: |
          rm -rf bundle bundle.tar.gz
          mkdir -p bundle
          STANDALONE_DIR="$(dirname "$(find frontend/.next/standalone -name server.js | head -1)")"
          cp -r "$STANDALONE_DIR/." bundle/
          cp -r frontend/.next/static bundle/.next/static
          cp -r frontend/public bundle/public
          cp ecosystem.config.cjs bundle/ecosystem.config.cjs
          tar -czf bundle.tar.gz -C bundle .

      - name: Upload to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          source: "bundle.tar.gz"
          target: "/opt/ai-calendar"

      - name: Deploy & restart
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            set -e
            export PATH="/usr/local/bin:$PATH"
            CURRENT="/opt/ai-calendar/app"
            PREVIOUS="/opt/ai-calendar/app.previous"
            rollback() {
              rm -rf "$CURRENT"
              if [ -d "$PREVIOUS" ]; then
                mv "$PREVIOUS" "$CURRENT"
                cd "$CURRENT"
                pm2 startOrReload ecosystem.config.cjs || true
              fi
            }
            trap rollback ERR
            mkdir -p /opt/ai-calendar/database/data
            rm -rf "$PREVIOUS"
            if [ -d "$CURRENT" ]; then
              mv "$CURRENT" "$PREVIOUS"
            fi
            mkdir -p "$CURRENT"
            tar -xzf /opt/ai-calendar/bundle.tar.gz -C "$CURRENT"
            rm -f /opt/ai-calendar/bundle.tar.gz
            cd "$CURRENT"
            pm2 startOrReload ecosystem.config.cjs
            pm2 save
            pm2 startup systemd -u root --hp /root >/dev/null 2>&1 || true
            HEALTHY=0
            for attempt in {1..10}; do
              if curl -fsS http://localhost:3000/api/health; then
                HEALTHY=1
                break
              fi
              sleep 2
            done
            if [ "$HEALTHY" -ne 1 ]; then
              pm2 logs --nostream --lines 50 || true
              false
            fi
            trap - ERR
            rm -rf "$PREVIOUS"
