<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#fafafa" />
    <title>AI Calendar · 离线</title>
    <style>
      :root { color-scheme: light; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #fafafa; color: #27272a; }
      main { width: min(22rem, calc(100% - 3rem)); padding: 2rem 1.5rem; border: 1px solid #e4e4e7; border-radius: 1rem; background: white; text-align: center; box-shadow: 0 8px 30px rgb(24 24 27 / 6%); }
      h1 { margin: 0 0 .75rem; font-size: 1.25rem; }
      p { margin: .5rem 0; color: #71717a; font-size: .9rem; line-height: 1.6; }
      a { display: inline-block; margin-top: 1rem; padding: .55rem 1rem; border-radius: .6rem; background: #18181b; color: white; text-decoration: none; font-size: .9rem; }
    </style>
  </head>
  <body>
    <main>
      <h1>当前处于离线状态</h1>
      <p>已经打开的日历页面仍可查看本地缓存日程。联网后重新打开即可同步最新数据。</p>
      <a href="/">重新连接</a>
    </main>
  </body>
</html>
